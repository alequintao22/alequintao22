name: Animação de contribuições

on:
  schedule:
    - cron: "0 6 * * *" # todo dia, 03h de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#087a43&color_dots=#ebedf0,#b5e8cd,#6fd3a0,#34c77b,#087a43
            dist/snake-dark.svg?color_snake=#34c77b&color_dots=#161b22,#0a5c35,#087a43,#34c77b,#8ff0bd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
